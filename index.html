<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프리미엄 분석 대시보드</title>
<style>
  :root {
    --bg: #0d0d0d;
    --card-bg: #161616;
    --border: #2a2a2a;
    --text: #eaeaea;
    --text-dim: #8a8a8a;
    --accent: #39ff88;       /* 포인트 컬러 (기본값, 사용자가 피커로 바꾸면 JS가 덮어씀) */
    --home: #4a4a4a;
    --hit: #34d058;          /* 적중 = 초록 */
    --miss: #ef4444;         /* 미적중 = 빨강 */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Malgun Gothic", sans-serif;
    padding: 32px 20px 80px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .meta {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .header-right {
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .accuracy {
    font-size: 13px;
    font-weight: 600;
    text-align: right;
  }
  .accuracy .rate {
    color: var(--accent);
    font-size: 18px;
  }
  .accuracy-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
    text-align: right;
  }
  .color-picker {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .color-picker label {
    font-size: 10px;
    color: var(--text-dim);
  }
  .color-picker input[type="color"] {
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: none;
    cursor: pointer;
    padding: 0;
  }
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .tabs button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tabs button.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  .tabs .tab-date {
    display: block;
    font-size: 10px;
    font-weight: 400;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .filters button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 14px;
    font-size: 12px;
    border-radius: 4px;
    cursor: pointer;
  }
  .filters button.active {
    color: var(--accent);
    border-color: var(--accent);
  }
  .section-title {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 28px 0 12px;
    border-left: 2px solid var(--accent);
    padding-left: 8px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .teams {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .teams .vs {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-dim);
    padding: 0 8px;
  }
  .score {
    font-variant-numeric: tabular-nums;
    color: var(--text);
    font-weight: 700;
    padding: 0 8px;
  }
  .prob-bar {
    height: 5px;
    border-radius: 3px;
    overflow: hidden;
    display: flex;
    background: var(--border);
    margin-bottom: 6px;
  }
  .prob-bar span { height: 100%; }
  .prob-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .ai-picks {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }
  .badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    white-space: nowrap;
  }
  .badge.hit { color: var(--hit); border-color: var(--hit); }
  .badge.miss { color: var(--miss); border-color: var(--miss); }
  .badge.pending { color: var(--text-dim); }
  .empty { color: var(--text-dim); font-size: 13px; padding: 40px 0; text-align: center; grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>프리미엄 분석 대시보드</h1>
      <div class="meta">수집 시각: 2026-08-21 22:58 UTC · 총 2건</div>
    </div>
    <div class="header-right">
      <div>
        <div class="accuracy"><span id="accuracy-label">적중률</span> <span class="rate" id="accuracy-rate">-</span></div>
        <div class="accuracy-sub" id="accuracy-sub"></div>
      </div>
      <div class="color-picker">
        <label for="accent-input">포인트 컬러</label>
        <input type="color" id="accent-input" value="#39ff88">
      </div>
    </div>
  </header>

  <div class="tabs" id="tabs">
    <button data-tab="yesterday">어제<span class="tab-date" id="tab-date-yesterday"></span></button>
    <button data-tab="today" class="active">오늘<span class="tab-date" id="tab-date-today"></span></button>
    <button data-tab="tomorrow">내일<span class="tab-date" id="tab-date-tomorrow"></span></button>
  </div>

  <div class="filters" id="filters">
    <button data-sport="all" class="active">전체</button>
    <button data-sport="soccer">축구</button>
    <button data-sport="basket">농구</button>
    <button data-sport="baseball">야구</button>
    <button data-sport="hockey">하키</button>
    <button data-sport="volley">배구</button>
  </div>

  <div class="section-title" id="upcoming-title">경기 예측</div>
  <div class="grid" id="upcoming-grid"></div>

  <div class="section-title" id="finished-title">경기 결과</div>
  <div class="grid" id="finished-grid"></div>
</div>

<script>
const DATA = {"scraped_at": "2026-08-21T22:58:35.167112+00:00", "kst_yesterday": "2026-08-21", "kst_today": "2026-08-22", "kst_tomorrow": "2026-08-23", "included_dates": ["2026-08-21", "2026-08-22", "2026-08-23"], "count": 2, "matches": [{"id": "16455252", "url": "https://bbongtv4.com/premium/soccer/16455252", "sport": "soccer", "league": "LIB Cup", "date": "8/21 (금)", "time": "07:00", "status": "예정", "result": null, "team1": "LDU 키토", "team2": "미라소우 FC", "score1": null, "score2": null, "prob": {"home": 60.0, "draw": 22.0, "away": 18.0}, "ai_summary": "LDU 키토 승", "ai_picks": [], "aria_label": "LDU 키토 vs 미라소우 FC 07:00 분석 상세", "source_date": "2026-08-21"}, {"id": "16455264", "url": "https://bbongtv4.com/premium/soccer/16455264", "sport": "soccer", "league": "LIB Cup", "date": "8/21 (금)", "time": "09:30", "status": "예정", "result": null, "team1": "코린치앙스", "team2": "로사리오 센트랄", "score1": null, "score2": null, "prob": {"home": 45.0, "draw": 25.0, "away": 30.0}, "ai_summary": "코린치앙스 승 (1골 차 박빙 승부 예상)", "ai_picks": [], "aria_label": "코린치앙스 vs 로사리오 센트랄 09:30 분석 상세", "source_date": "2026-08-21"}]};

// ---------- 포인트 컬러 (사용자 지정, 브라우저에 저장) ----------
const ACCENT_STORAGE_KEY = "bbongtv_accent_color";
const accentInput = document.getElementById("accent-input");

function applyAccentColor(hex) {
  document.documentElement.style.setProperty("--accent", hex);
  accentInput.value = hex;
}

(function initAccentColor() {
  const saved = localStorage.getItem(ACCENT_STORAGE_KEY);
  if (saved) applyAccentColor(saved);
})();

accentInput.addEventListener("input", (e) => {
  const hex = e.target.value;
  applyAccentColor(hex);
  localStorage.setItem(ACCENT_STORAGE_KEY, hex);
});

// ---------- 탭 (어제 / 오늘 / 내일) ----------
const TAB_DATES = {
  yesterday: DATA.kst_yesterday || null,
  today: DATA.kst_today || null,
  tomorrow: DATA.kst_tomorrow || null,
};

document.getElementById("tab-date-yesterday").textContent = TAB_DATES.yesterday || "";
document.getElementById("tab-date-today").textContent = TAB_DATES.today || "";
document.getElementById("tab-date-tomorrow").textContent = TAB_DATES.tomorrow || "";

let currentTab = "today";
let currentSport = "all";

// ---------- 카드 렌더링 ----------
function pct(v) { return (v === undefined || v === null) ? 0 : v; }

function leaderOf(prob) {
  const home = pct(prob.home), draw = pct(prob.draw), away = pct(prob.away);
  let leader = "home", max = home;
  if (draw > max) { leader = "draw"; max = draw; }
  if (away > max) { leader = "away"; max = away; }
  return leader;
}

function probBarHTML(prob, leader) {
  const home = pct(prob.home), draw = pct(prob.draw), away = pct(prob.away);
  const activeColor = "var(--accent)";
  const inactiveColor = "var(--home)";
  return `
    <div class="prob-bar">
      ${home ? `<span style="width:${home}%; background:${leader === "home" ? activeColor : inactiveColor}"></span>` : ""}
      ${draw ? `<span style="width:${draw}%; background:${leader === "draw" ? activeColor : inactiveColor}"></span>` : ""}
      ${away ? `<span style="width:${away}%; background:${leader === "away" ? activeColor : inactiveColor}"></span>` : ""}
    </div>
    <div class="prob-labels">
      <span>홈 ${home}%</span>
      ${draw ? `<span>무 ${draw}%</span>` : ""}
      <span>원정 ${away}%</span>
    </div>
  `;
}

function cardHTML(m) {
  const hasScore = m.score1 !== null && m.score1 !== undefined;
  const scoreHTML = hasScore
    ? `<span class="score">${m.score1} : ${m.score2}</span>`
    : `<span class="vs">VS</span>`;

  let badge = `<span class="badge pending">예정</span>`;
  if (m.status === "종료") {
    if (m.result === "적중") badge = `<span class="badge hit">적중</span>`;
    else if (m.result === "미적중") badge = `<span class="badge miss">미적중</span>`;
    else badge = `<span class="badge">완료</span>`;
  }

  const prob = m.prob || {};
  const leader = leaderOf(prob);
  const team1Color = leader === "home" ? "var(--accent)" : "var(--text)";
  const team2Color = leader === "away" ? "var(--accent)" : "var(--text)";

  // 클릭/이동 불가 - 순수 정보 카드로만 표시
  return `
    <div class="card">
      <div class="card-head">
        <span>${m.league || ""}</span>
        <span>${m.date || ""} ${m.time || ""}</span>
      </div>
      <div class="teams">
        <span style="color:${team1Color}">${m.team1 || "?"}</span>
        ${scoreHTML}
        <span style="color:${team2Color}">${m.team2 || "?"}</span>
      </div>
      ${probBarHTML(prob, leader)}
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top: 4px;">
        <div class="ai-picks">${(m.ai_picks || []).join(", ")}</div>
        ${badge}
      </div>
    </div>
  `;
}

// ---------- 적중률 (현재 탭의 날짜 기준) ----------
function updateAccuracy(dayMatches) {
  const finished = dayMatches.filter(m => m.status === "종료");
  const hits = finished.filter(m => m.result === "적중").length;
  const misses = finished.filter(m => m.result === "미적중").length;
  const total = hits + misses;

  const label = currentTab === "today" ? "오늘 적중률" : currentTab === "yesterday" ? "어제 적중률" : "적중률";
  document.getElementById("accuracy-label").textContent = label;

  const rateEl = document.getElementById("accuracy-rate");
  const subEl = document.getElementById("accuracy-sub");
  if (total === 0) {
    rateEl.textContent = "-";
    subEl.textContent = "완료된 경기 없음";
    return;
  }
  const rate = ((hits / total) * 100).toFixed(1);
  rateEl.textContent = `${rate}%`;
  subEl.textContent = `${hits}적중 / ${misses}미적중 (${total}건)`;
}

// ---------- 메인 렌더 ----------
function render() {
  const tabDate = TAB_DATES[currentTab];

  const dayMatches = DATA.matches.filter(m =>
    (tabDate ? m.source_date === tabDate : false) &&
    (currentSport === "all" || m.sport === currentSport)
  );

  const upcoming = dayMatches.filter(m => m.status !== "종료");
  const finished = dayMatches.filter(m => m.status === "종료");

  const upTitle = document.getElementById("upcoming-title");
  const finTitle = document.getElementById("finished-title");
  const upGrid = document.getElementById("upcoming-grid");
  const finGrid = document.getElementById("finished-grid");

  if (currentTab === "yesterday") {
    // 어제: 결과 위주. 예정 섹션은 숨김.
    upTitle.style.display = "none";
    upGrid.style.display = "none";
    finTitle.style.display = "block";
    finTitle.textContent = "경기 결과";
    finGrid.style.display = "grid";
  } else if (currentTab === "tomorrow") {
    // 내일: 예측만 있을 수 있음. 결과 섹션은 숨김.
    upTitle.style.display = "block";
    upTitle.textContent = "경기 예측";
    upGrid.style.display = "grid";
    finTitle.style.display = "none";
    finGrid.style.display = "none";
  } else {
    // 오늘: 예측 + (진행 중이면) 결과 둘 다.
    upTitle.style.display = "block";
    upTitle.textContent = "경기 예측";
    upGrid.style.display = "grid";
    finTitle.style.display = "block";
    finTitle.textContent = "경기 결과";
    finGrid.style.display = "grid";
  }

  if (upGrid.style.display !== "none") {
    upGrid.innerHTML = upcoming.length ? upcoming.map(cardHTML).join("") : `<div class="empty">예정된 경기가 없습니다.</div>`;
  }
  if (finGrid.style.display !== "none") {
    finGrid.innerHTML = finished.length ? finished.map(cardHTML).join("") : `<div class="empty">${
      !tabDate ? "데이터가 없습니다." : (currentTab === "tomorrow" ? "" : "완료된 경기가 없습니다.")
    }</div>`;
  }

  updateAccuracy(dayMatches);
}

document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentTab = btn.dataset.tab;
  render();
});

document.getElementById("filters").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#filters button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentSport = btn.dataset.sport;
  render();
});

render();
</script>
</body>
</html>
