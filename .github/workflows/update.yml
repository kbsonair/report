name: Update premium analysis data

on:
  schedule:
    # 20분마다 실행 (UTC 기준, 필요에 맞게 조정)
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# 이전 실행이 아직 push 중이면 새 실행을 큐에 대기시켜서
# 두 실행이 동시에 같은 브랜치에 커밋/push하다 충돌하는 것을 방지한다.
concurrency:
  group: update-premium-data
  cancel-in-progress: false

jobs:
  scrape-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper (오늘)
        run: python scraper.py --skip-latest

      - name: Compute KST yesterday/tomorrow
        id: dates
        run: |
          Y=$(python3 -c "from datetime import datetime,timedelta; from zoneinfo import ZoneInfo; print((datetime.now(ZoneInfo('Asia/Seoul'))-timedelta(days=1)).strftime('%Y-%m-%d'))")
          T=$(python3 -c "from datetime import datetime,timedelta; from zoneinfo import ZoneInfo; print((datetime.now(ZoneInfo('Asia/Seoul'))+timedelta(days=1)).strftime('%Y-%m-%d'))")
          echo "yesterday=$Y" >> "$GITHUB_OUTPUT"
          echo "tomorrow=$T" >> "$GITHUB_OUTPUT"

      - name: Run scraper (어제, 최종 결과 확정용)
        continue-on-error: true
        run: python scraper.py --date ${{ steps.dates.outputs.yesterday }} --skip-latest

      - name: Run scraper (내일, 있으면)
        continue-on-error: true
        run: python scraper.py --date ${{ steps.dates.outputs.tomorrow }} --skip-latest

      - name: Merge yesterday/today/tomorrow snapshots into latest.json
        run: python merge_history.py --back 1 --forward 1

      - name: Render HTML
        run: python render.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "자동 업데이트: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi